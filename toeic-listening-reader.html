<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>英文リーダー</title>

  <!-- PWA: manifest & theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="英文リーダー">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #ede9fe 0%, #e0f2fe 100%);
      min-height: 100vh;
      padding: 28px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e1b4b;
    }
    header p {
      font-size: 0.82rem;
      color: #6d6b8a;
      margin-top: 4px;
    }

    /* panels */
    .panels {
      display: flex;
      gap: 16px;
      max-width: 1140px;
      margin: 0 auto 16px;
    }
    .panel {
      flex: 1;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(99,102,241,0.10);
      padding: 18px 18px 14px;
      display: flex;
      flex-direction: column;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .panel-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #7c3aed;
    }
    .char-count {
      font-size: 0.72rem;
      color: #a0aec0;
    }

    /* reset (clear) button */
    .btn-reset {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f1f5f9;
      color: #64748b;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
      font-family: inherit;
      line-height: 1.2;
    }
    .btn-reset:hover {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fca5a5;
    }
    .btn-reset:active { transform: scale(0.96); }
    .btn-reset:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-reset:disabled:hover {
      background: #f1f5f9;
      color: #64748b;
      border-color: #e2e8f0;
    }

    #en-textarea {
      display: block;
      width: 100%;
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 1rem;
      line-height: 1.75;
      resize: none;
      outline: none;
      color: #1e293b;
      min-height: 300px;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    #en-textarea:focus { border-color: #7c3aed; }
    #en-textarea::placeholder { color: #c4b5fd; }

    #en-display {
      display: none;
      flex: 1;
      border: 1.5px solid #7c3aed;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 1rem;
      line-height: 1.75;
      color: #1e293b;
      min-height: 300px;
      overflow-y: auto;
      background: #faf9ff;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .word { display: inline; cursor: default; }
    .word.active {
      background: #fef3c7;
      border-radius: 3px;
      color: #1e293b;
      font-weight: 500;
      box-shadow: 0 0 0 2px #fef3c7;
    }
    .word.done { color: #64748b; }

    #trans-box {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 1rem;
      line-height: 1.75;
      color: #334155;
      min-height: 300px;
      overflow-y: auto;
      background: #f8fafc;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .trans-placeholder { color: #c4b5fd; }
    .trans-loading { color: #7c3aed; display: flex; align-items: center; gap: 8px; }
    .trans-error { color: #ef4444; font-size: 0.9rem; }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid #ddd6fe;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* sequence bar */
    .seq-wrap {
      max-width: 1140px;
      margin: 0 auto 16px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(99,102,241,0.08);
      padding: 12px 18px;
    }
    .seq-wrap.hidden { display: none; }
    .seq-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .seq-meta span:last-child { color: #7c3aed; font-weight: 600; }

    .seq-track {
      width: 100%;
      height: 8px;
      background: #ede9fe;
      border-radius: 99px;
      position: relative;
      /* overflow visible so the 14px thumb is not clipped */
    }
    .seq-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #6366f1);
      border-radius: 99px;
      transition: width 0.15s ease;
      pointer-events: none;
    }
    .seq-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      background: #7c3aed;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(124,58,237,0.6);
      transition: left 0.2s ease;
      pointer-events: none;
    }

    /* controls */
    .controls {
      max-width: 1140px;
      margin: 0 auto 16px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(99,102,241,0.10);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-play {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(124,58,237,0.3);
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-play:hover { opacity: 0.9; }
    .btn-play:active { transform: scale(0.97); }
    .btn-play.paused {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      box-shadow: 0 4px 12px rgba(249,115,22,0.3);
    }

    .btn-stop {
      display: flex; align-items: center; gap: 7px;
      background: #f1f5f9;
      color: #475569;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-stop:hover { background: #e2e8f0; }
    .btn-stop.active {
      background: #ede9fe;
      color: #5b21b6;
      border-color: #c4b5fd;
    }

    .divider {
      width: 1px; height: 28px;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    /* voice section */
    .voice-wrap {
      display: flex; align-items: center; gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .voice-label { font-size: 0.8rem; color: #6b7280; white-space: nowrap; }
    #voice-select {
      flex: 1;
      min-width: 0;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
      color: #374151;
      outline: none;
      cursor: pointer;
    }
    #voice-select:focus { border-color: #7c3aed; }
    /* highlight high quality voice candidates */
    option.natural-voice {
      font-weight: 600;
      color: #5b21b6;
    }

    .speed-group {
      display: flex; align-items: center; gap: 7px;
    }
    .speed-label { font-size: 0.8rem; color: #6b7280; white-space: nowrap; }
    .spd {
      background: #f1f5f9;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s;
    }
    .spd:hover { background: #ede9fe; border-color: #c4b5fd; }
    .spd.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }

    /* voice badge */
    .voice-badge {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      background: linear-gradient(90deg, #0078d4, #005a9e);
      color: #fff;
      border-radius: 6px;
      padding: 3px 9px;
      white-space: nowrap;
    }
    .voice-badge.show { display: flex; }

    .status-msg {
      max-width: 1140px;
      margin: 0 auto 8px;
      font-size: 0.78rem;
      color: #9ca3af;
      text-align: center;
      min-height: 0;
    }
    .status-msg:empty { margin: 0 auto; }

    @media (max-width: 700px) {
      body {
        padding: 14px 8px 18px;
      }
      header {
        margin-bottom: 10px;
      }
      header h1 {
        font-size: 1.45rem;
        line-height: 1.25;
      }
      header p {
        font-size: 0.72rem;
        margin-top: 2px;
      }
      .seq-wrap {
        margin: 0 0 10px;
        border-radius: 12px;
        padding: 9px 12px;
      }
      .seq-meta {
        margin-bottom: 6px;
      }
      .controls {
        margin: 0 0 10px;
        padding: 10px;
        border-radius: 14px;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
        align-items: stretch;
      }
      .btn-play,
      .btn-stop,
      .spd {
        min-height: 38px;
        border-radius: 9px;
        font-size: 0.82rem;
        line-height: 1;
      }
      .btn-play,
      #btn-stop {
        justify-content: center;
        padding: 8px 10px;
      }
      .btn-play {
        grid-column: span 3;
        box-shadow: 0 3px 10px rgba(124,58,237,0.24);
      }
      #btn-stop {
        grid-column: span 3;
      }
      .divider,
      .voice-badge {
        display: none !important;
      }
      .voice-wrap {
        grid-column: 1 / -1;
        gap: 6px;
      }
      .voice-label,
      .speed-label {
        font-size: 0.74rem;
      }
      #voice-select {
        height: 36px;
        padding: 5px 8px;
        font-size: 0.78rem;
      }
      .speed-group {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: auto repeat(4, minmax(0, 1fr));
        gap: 6px;
        align-items: center;
      }
      .spd {
        padding: 6px 4px;
      }
      .utility-btn {
        grid-column: span 2;
        justify-content: center;
        padding: 8px 6px;
        gap: 5px;
        font-size: 0.75rem;
      }
      #copy-chatgpt-btn {
        grid-column: span 2;
      }
      .panels {
        flex-direction: column;
        gap: 10px;
        margin: 0 0 10px;
      }
      .panel {
        border-radius: 14px;
        padding: 12px 8px 10px;
      }
      .panel-head {
        margin-bottom: 8px;
        padding: 0 2px;
      }
      .panel-label {
        font-size: 0.66rem;
        letter-spacing: 0.08em;
      }
      .char-count {
        font-size: 0.68rem;
      }
      .btn-reset {
        padding: 4px 8px;
        font-size: 0.68rem;
      }
      #en-textarea,
      #en-display,
      #trans-box {
        min-height: 280px;
        border-radius: 9px;
        padding: 10px 10px;
        font-size: 0.92rem;
        line-height: 1.62;
      }
      #en-display {
        word-break: normal;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>📖 英文リーダー</h1>
  <p>英文を貼り付けると和訳＋音声読み上げができます</p>
</header>

<!-- Panels -->
<!-- Sequence bar -->
<div class="seq-wrap">
  <div class="seq-meta">
    <span id="seq-word-info">— / — 文</span>
    <span id="seq-pct">0%</span>
  </div>
  <div class="seq-track" id="seq-track">
    <div class="seq-fill" id="seq-fill"></div>
    <div class="seq-thumb" id="seq-thumb" style="left:0%"></div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="btn-play" id="btn-play" onclick="togglePlay()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    再生
  </button>
  <button class="btn-stop" id="btn-stop" onclick="stopAll()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    停止
  </button>

  <div class="divider"></div>

  <span class="voice-badge" id="natural-badge">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.7H21l-5.5 4 2.1 6.8-5.6-4.1-5.6 4.1 2.1-6.8L3 8.7h6.8L12 2z"/></svg>
    高品質
  </span>

  <div class="voice-wrap">
    <span class="voice-label">声：</span>
    <select id="voice-select"><option>読み込み中…</option></select>
  </div>

  <div class="speed-group">
    <span class="speed-label">速度：</span>
    <button class="spd active" data-speed="1" onclick="setSpeed(1.0,this)">1.0×</button>
    <button class="spd" data-speed="1.2" onclick="setSpeed(1.2,this)">1.2×</button>
    <button class="spd" data-speed="1.5" onclick="setSpeed(1.5,this)">1.5×</button>
    <button class="spd" data-speed="2" onclick="setSpeed(2.0,this)">2.0×</button>
  </div>

  <button class="btn-stop utility-btn" id="sentence-mode-btn" type="button" onclick="toggleSentenceMode()" aria-pressed="false">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
    文ごと表示
  </button>
  <button class="btn-stop utility-btn active" id="tracking-toggle-btn" type="button" onclick="toggleTracking()" aria-pressed="true">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg>
    追跡表示
  </button>
  <button class="btn-stop utility-btn" id="copy-chatgpt-btn" type="button" onclick="copyChatGPTPrompt()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    GPTコピー
  </button>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-head">
      <span class="panel-label">🇺🇸 English</span>
      <div class="panel-head-right">
        <span class="char-count" id="char-count">0 文字</span>
        <button type="button" class="btn-reset" id="btn-reset" onclick="resetEnglish()" title="英文を空白にします" aria-label="英文をクリア" disabled>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
          クリア
        </button>
      </div>
    </div>
    <textarea id="en-textarea" placeholder="ここに英文を貼り付けてください…" rows="12"></textarea>
    <div id="en-display"></div>
  </div>
  <div class="panel">
    <div class="panel-head">
      <span class="panel-label">🇯🇵 日本語訳</span>
    </div>
    <div id="trans-box"><span class="trans-placeholder">英文を入力すると自動で翻訳されます</span></div>
  </div>
</div>

<div class="status-msg" id="status-msg"></div>

<script>
/* ============================================================
   Service Worker 登録 (PWA)
   ============================================================ */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.warn('SW registration failed:', err);
    });
  });
}

/* ============================================================
   State
   ============================================================ */
let speed   = 1.0;
let utt     = null;
let words   = [];
let wordEls = [];
let sentenceOffsets = [];
let totalWords = 0;
let currentWordIdx = -1;
let playing = false;
let paused  = false;
let transTimer = null;
let allVoices  = [];
let bestVoices = [];
let otherVoices = [];
let voiceRetryTimer = null;
let voiceRetryIndex = 0;
let userSelectedVoice = false;
let sentenceMode = false;
let trackingEnabled = true;
const VOICE_RETRY_DELAYS = [100, 300, 700, 1500, 3000, 6000];
const VOICE_STORAGE_KEY = 'english-reader-selected-voice-v1';
const SPEED_STORAGE_KEY = 'english-reader-speed-v1';
const SENTENCE_MODE_STORAGE_KEY = 'english-reader-sentence-mode-v1';
const TRACKING_STORAGE_KEY = 'english-reader-tracking-v1';

/* ============================================================
   Voice loading — prioritize high quality English candidates
   ============================================================ */
function getVoiceKey(v) {
  return v.voiceURI || `${getVoiceName(v)}|${getVoiceLang(v)}`;
}

function getVoiceSearchText(v) {
  return `${getVoiceName(v)} ${getVoiceLang(v)} ${v.voiceURI || ''}`;
}

function getVoiceName(v) {
  return v.name || v.voiceURI || '名称不明の音声';
}

function getVoiceLang(v) {
  if (v.lang) return v.lang;
  const text = `${v.name || ''} ${v.voiceURI || ''}`;
  if (/\b(en-US|English \(United States\)|United States)\b/i.test(text)) return 'en-US';
  if (/\b(en-GB|English \(United Kingdom\)|United Kingdom|Great Britain)\b/i.test(text)) return 'en-GB';
  if (/\b(en-AU|English \(Australia\)|Australia)\b/i.test(text)) return 'en-AU';
  if (/\b(en-CA|English \(Canada\)|Canada)\b/i.test(text)) return 'en-CA';
  if (/\b(en-IN|English \(India\)|India)\b/i.test(text)) return 'en-IN';
  if (/\bEnglish\b/i.test(text)) return 'en-US';
  return '';
}

function isEnglishVoice(v) {
  return /^en([_-]|$)/i.test(getVoiceLang(v)) || /\bEnglish\b/i.test(getVoiceSearchText(v));
}

function isMicrosoftVoice(v) {
  return /Microsoft/i.test(getVoiceSearchText(v));
}

function isHighQualityVoice(v) {
  return isMicrosoftVoice(v) && isEnglishVoice(v) && /(Natural|Online)/i.test(getVoiceSearchText(v));
}

function displayVoiceName(v) {
  const lang = getVoiceLang(v);
  const fallbackLabel = lang ? `音声 (${lang})` : '名称不明の音声';
  return (getVoiceName(v) || fallbackLabel)
    .replace('Microsoft ', '')
    .replace(' Online (Natural)', ' ✦')
    .replace(' Online', ' ✦')
    .replace('- English (', '(');
}

function getSavedVoiceChoice() {
  try {
    return JSON.parse(localStorage.getItem(VOICE_STORAGE_KEY) || 'null');
  } catch {
    return null;
  }
}

function saveVoiceChoice(value) {
  try {
    localStorage.setItem(VOICE_STORAGE_KEY, value);
  } catch {}
}

function getSavedSpeed() {
  try {
    const saved = Number(localStorage.getItem(SPEED_STORAGE_KEY));
    return [1, 1.2, 1.5, 2].includes(saved) ? saved : null;
  } catch {
    return null;
  }
}

function saveSpeedChoice(value) {
  try {
    localStorage.setItem(SPEED_STORAGE_KEY, String(value));
  } catch {}
}

function getSavedSentenceMode() {
  try {
    return localStorage.getItem(SENTENCE_MODE_STORAGE_KEY) === '1';
  } catch {
    return false;
  }
}

function saveSentenceMode() {
  try {
    localStorage.setItem(SENTENCE_MODE_STORAGE_KEY, sentenceMode ? '1' : '0');
  } catch {}
}

function getSavedTracking() {
  try {
    const saved = localStorage.getItem(TRACKING_STORAGE_KEY);
    return saved === null ? true : saved === '1';
  } catch {
    return true;
  }
}

function saveTracking() {
  try {
    localStorage.setItem(TRACKING_STORAGE_KEY, trackingEnabled ? '1' : '0');
  } catch {}
}

function scheduleVoiceReload() {
  if (voiceRetryIndex >= VOICE_RETRY_DELAYS.length) return;
  clearTimeout(voiceRetryTimer);
  const delay = VOICE_RETRY_DELAYS[voiceRetryIndex++];
  voiceRetryTimer = setTimeout(loadVoices, delay);
}

function selectVoiceOption(sel, voice) {
  if (!voice) return false;
  const key = getVoiceKey(voice);
  for (const opt of sel.options) {
    try {
      const parsed = JSON.parse(opt.value);
      if (parsed.key === key || (parsed.name === getVoiceName(voice) && parsed.lang === getVoiceLang(voice))) {
        sel.value = opt.value;
        return true;
      }
    } catch {}
  }
  return false;
}

function selectVoiceFromSavedChoice(sel, saved) {
  if (!saved) return false;
  for (const opt of sel.options) {
    try {
      const parsed = JSON.parse(opt.value);
      if (parsed.key === saved.key ||
          (parsed.name === saved.name && parsed.lang === saved.lang)) {
        sel.value = opt.value;
        return true;
      }
    } catch {}
  }
  return false;
}

function updateQualityBadge() {
  const badge = document.getElementById('natural-badge');
  const voice = getSelectedVoice();
  badge.classList.toggle('show', !!voice && isHighQualityVoice(voice));
}

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) {
    scheduleVoiceReload();
    return;
  }

  const sel = document.getElementById('voice-select');
  const selectedBefore = getSelectedVoice();
  const savedChoice = getSavedVoiceChoice();
  allVoices = voices;

  // Tier 1: high quality English voice candidates
  bestVoices = voices.filter(isHighQualityVoice);
  // Tier 2: Microsoft English voices
  const msVoices = voices.filter(v =>
    isMicrosoftVoice(v) && isEnglishVoice(v) && !bestVoices.includes(v)
  );
  // Tier 3: Other English voices
  otherVoices = voices.filter(v =>
    !isMicrosoftVoice(v) && isEnglishVoice(v)
  );
  // Fallback: any voice if no English
  if (!bestVoices.length && !msVoices.length && !otherVoices.length) {
    otherVoices = voices;
  }

  sel.innerHTML = '';

  // Build grouped option list
  function addGroup(label, list, isHighQuality) {
    if (!list.length) return;
    const grp = document.createElement('optgroup');
    grp.label = label;
    list.forEach(v => {
      const o = document.createElement('option');
      o.value = JSON.stringify({
        key: getVoiceKey(v),
        name: getVoiceName(v),
        lang: getVoiceLang(v),
        highQuality: isHighQuality
      });
      o.textContent = displayVoiceName(v);
      if (isHighQuality) o.className = 'natural-voice';
      grp.appendChild(o);
    });
    sel.appendChild(grp);
  }

  if (bestVoices.length) {
    addGroup('高品質候補', bestVoices, true);
  }
  if (msVoices.length) {
    addGroup('英語音声', msVoices, false);
  }
  if (otherVoices.length) {
    addGroup('その他', otherVoices, false);
  }

  // Auto-select: prefer familiar US voices, then the first high quality candidate
  const preferNames = ['Jenny', 'Aria', 'Ava', 'Andrew', 'Ryan', 'Sonia', 'Guy', 'Ana'];
  let autoSelect = null;
  for (const name of preferNames) {
    autoSelect = bestVoices.find(v => getVoiceSearchText(v).includes(name));
    if (autoSelect) break;
  }
  if (!autoSelect && bestVoices.length) autoSelect = bestVoices[0];

  let selected = false;
  if (userSelectedVoice && selectedBefore) {
    selected = selectVoiceOption(sel, selectedBefore);
  }
  if (!selected && savedChoice) {
    selected = selectVoiceFromSavedChoice(sel, savedChoice);
    userSelectedVoice = selected;
  }
  if (!selected && autoSelect) {
    selected = selectVoiceOption(sel, autoSelect);
  }
  updateQualityBadge();

  if (bestVoices.length) {
    clearTimeout(voiceRetryTimer);
    voiceRetryIndex = VOICE_RETRY_DELAYS.length;
  } else {
    scheduleVoiceReload();
  }
}

speechSynthesis.onvoiceschanged = loadVoices;
document.getElementById('voice-select').addEventListener('change', () => {
  userSelectedVoice = true;
  saveVoiceChoice(document.getElementById('voice-select').value);
  updateQualityBadge();
});
loadVoices();

/* ============================================================
   Get currently selected voice object
   ============================================================ */
function getSelectedVoice() {
  const sel = document.getElementById('voice-select');
  try {
    const parsed = JSON.parse(sel.value);
    return allVoices.find(v => getVoiceKey(v) === parsed.key) ||
           allVoices.find(v => getVoiceName(v) === parsed.name && getVoiceLang(v) === parsed.lang) ||
           null;
  } catch {
    return null;
  }
}

/* ============================================================
   Textarea input + auto-translate
   ============================================================ */
const textarea = document.getElementById('en-textarea');
const btnReset = document.getElementById('btn-reset');

function updateResetBtnState() {
  if (!btnReset) return;
  btnReset.disabled = textarea.value.length === 0;
}

textarea.addEventListener('input', () => {
  const t = textarea.value;
  document.getElementById('char-count').textContent = t.length + ' 文字';
  updateResetBtnState();
  if (sentenceMode && !playing && !paused) {
    if (t.trim()) {
      buildDisplay(t.trim());
      fullText = t.trim();
      showDisplay(true);
    } else {
      showDisplay(false);
      resetBar();
    }
  }
  clearTimeout(transTimer);
  if (!t.trim()) { resetTransBox(); return; }
  document.getElementById('trans-box').innerHTML =
    '<span class="trans-loading"><span class="spinner"></span>翻訳中…</span>';
  transTimer = setTimeout(() => doTranslate(t.trim()), 900);
});

function resetTransBox() {
  document.getElementById('trans-box').innerHTML =
    '<span class="trans-placeholder">英文を入力すると自動で翻訳されます</span>';
}

/* ============================================================
   Reset (clear) English textarea with one click/tap
   ============================================================ */
function resetEnglish() {
  // Stop any ongoing playback so highlights / state are cleared too
  if (playing || paused) {
    stopAll();
  } else {
    showDisplay(false);
    resetBar();
  }
  // Clear text and translation
  textarea.value = '';
  document.getElementById('char-count').textContent = '0 文字';
  clearTimeout(transTimer);
  resetTransBox();
  updateResetBtnState();
  textarea.focus();
}

async function doTranslate(text) {
  // Primary: Google Translate unofficial endpoint
  const url = 'https://translate.googleapis.com/translate_a/single'
    + '?client=gtx&sl=en&tl=ja&dt=t&q=' + encodeURIComponent(text);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const translated = data[0].map(seg => seg[0]).join('');
    document.getElementById('trans-box').textContent = translated;
  } catch {
    // Fallback: MyMemory
    try {
      const r2 = await fetch(
        'https://api.mymemory.translated.net/get?q='
        + encodeURIComponent(text.slice(0, 500)) + '&langpair=en|ja'
      );
      const d2 = await r2.json();
      if (d2.responseStatus === 200) {
        document.getElementById('trans-box').textContent = d2.responseData.translatedText;
      } else throw new Error();
    } catch {
      document.getElementById('trans-box').innerHTML =
        '<span class="trans-error">⚠️ 翻訳に失敗しました。ネットワーク接続を確認してください。</span>';
    }
  }
}

/* ============================================================
   Sentence tokenizer
   ============================================================ */
function splitIntoSentences(text) {
  const abbreviations = [];
  const protectedText = text
    .replace(/\b(?:Mr|Mrs|Ms|Dr|Prof|St|Inc|Ltd|Co|Corp|vs)\./g, (match) => {
      const key = `@@ABBR${abbreviations.length}@@`;
      abbreviations.push(match);
      return key;
    })
    .replace(/\b(?:U\.S|U\.K|e\.g|i\.e)\./gi, (match) => {
      const key = `@@ABBR${abbreviations.length}@@`;
      abbreviations.push(match);
      return key;
    });

  const sentences = protectedText
    .replace(/\s+/g, ' ')
    .trim()
    .match(/[^.!?]+[.!?]+(?:["')\]]+)?|[^.!?]+$/g);

  return (sentences || [protectedText])
    .map((sentence) => sentence
      .replace(/@@ABBR(\d+)@@/g, (_, idx) => abbreviations[Number(idx)] || '')
      .trim()
    )
    .filter(Boolean);
}

function buildDisplay(text) {
  const display = document.getElementById('en-display');
  display.innerHTML = '';
  words = splitIntoSentences(text);
  wordEls = [];
  sentenceOffsets = [];

  let searchFrom = 0;
  words.forEach((sentence) => {
    const foundAt = text.indexOf(sentence, searchFrom);
    const offset = foundAt >= 0 ? foundAt : searchFrom;
    sentenceOffsets.push(offset);
    searchFrom = offset + sentence.length;
  });

  words.forEach((sentence, idx) => {
    const sp = document.createElement('span');
    sp.className = 'word sentence';
    sp.textContent = sentence;
    display.appendChild(sp);
    wordEls.push(sp);
    if (idx < words.length - 1) {
      display.appendChild(document.createTextNode(sentenceMode ? '\n' : ' '));
    }
  });
  totalWords = words.length;
}

/* ============================================================
   Sequence bar
   ============================================================ */
function updateBar(idx) {
  if (totalWords === 0) return;
  const pct = ((idx + 1) / totalWords) * 100;
  document.getElementById('seq-fill').style.width  = Math.min(pct, 100) + '%';
  document.getElementById('seq-thumb').style.left  = Math.min(pct, 100) + '%';
  document.getElementById('seq-pct').textContent   = Math.round(pct) + '%';
  document.getElementById('seq-word-info').textContent =
    (idx + 1) + ' / ' + totalWords + ' 文';
}

function resetBar() {
  document.getElementById('seq-fill').style.width  = '0%';
  document.getElementById('seq-thumb').style.left  = '0%';
  document.getElementById('seq-pct').textContent   = '0%';
  document.getElementById('seq-word-info').textContent = '— / — 文';
}

/* ============================================================
   Playback
   ============================================================ */
function togglePlay() {
  if (!playing && !paused) { startPlay(); return; }
  if (playing && !paused)  { pausePlay(); return; }
  if (paused)               { resumePlay(); return; }
}

let fullText = '';
let playbackSessionId = 0;
let stopRequested = false;
let sentenceTimers = [];
let boundarySeen = false;
let queuedUtterances = [];

function clearSentenceTimers() {
  sentenceTimers.forEach(timer => clearTimeout(timer));
  sentenceTimers = [];
}

function estimateSentenceDuration(sentence) {
  const wordCount = (sentence.match(/[A-Za-z0-9'$-]+/g) || []).length || 1;
  const wpm = 155 * Math.max(0.7, speed);
  return Math.max(650, (wordCount / wpm) * 60000);
}

function startEstimatedHighlights(fromIdx, sessionId) {
  clearSentenceTimers();
  let delay = 0;
  for (let i = fromIdx + 1; i < words.length; i++) {
    delay += estimateSentenceDuration(words[i - 1]);
    const timer = setTimeout(() => {
      if (sessionId !== playbackSessionId || stopRequested || paused) return;
      highlightWord(i);
    }, delay);
    sentenceTimers.push(timer);
  }
}

function getSentenceIndexFromChar(charIdx) {
  for (let i = sentenceOffsets.length - 1; i >= 0; i--) {
    if (charIdx >= sentenceOffsets[i]) return i;
  }
  return 0;
}

function startPlay(fromWordIdx = 0) {
  const text = textarea.value.trim();
  if (!text) { setStatus('英文を入力してください'); return; }

  if (fromWordIdx === 0 || fullText !== text) {
    buildDisplay(text);
    fullText = text;
    fromWordIdx = 0;
  }
  showDisplay(trackingEnabled || sentenceMode);

  const voice = getSelectedVoice();
  const sessionId = ++playbackSessionId;
  const startIdx = Math.max(0, Math.min(fromWordIdx, words.length - 1));
  stopRequested = false;
  boundarySeen = false;
  currentWordIdx = startIdx - 1;
  setPlayBtn('pause');
  setStatus('読み上げ準備中…');

  if (trackingEnabled) {
    startTrackedQueue(startIdx, sessionId, voice);
  } else {
    startContinuousPlay(startIdx, sessionId, voice);
  }
}

function applyVoiceToUtterance(target, voice) {
  target.lang = voice ? (getVoiceLang(voice) || 'en-US') : 'en-US';
  if (voice) target.voice = voice;
  target.rate = speed;
}

function startContinuousPlay(startIdx, sessionId, voice) {
  const charOffset = sentenceOffsets[startIdx] || 0;
  const speakText = fullText.substring(charOffset);
  utt = new SpeechSynthesisUtterance(speakText);
  applyVoiceToUtterance(utt, voice);

  utt.onstart = () => {
    if (sessionId !== playbackSessionId || stopRequested) return;
    playing = true; paused = false;
    setPlayBtn('pause');
    const vName = voice ? displayVoiceName(voice).replace(' ✦','') : '既定';
    setStatus('読み上げ中… ' + vName);
  };

  utt.onend = () => {
    if (sessionId !== playbackSessionId || stopRequested) return;
    clearSentenceTimers();
    finishPlay(sessionId);
  };

  utt.onerror = (e) => {
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    if (sessionId !== playbackSessionId || stopRequested) return;
    playing = false; paused = false;
    setPlayBtn('play');
    setStatus('エラー: ' + e.error);
    showDisplay(false);
  };

  speechSynthesis.speak(utt);
}

function startTrackedQueue(startIdx, sessionId, voice) {
  clearSentenceTimers();
  queuedUtterances = [];

  for (let i = startIdx; i < words.length; i++) {
    const item = new SpeechSynthesisUtterance(words[i]);
    applyVoiceToUtterance(item, voice);

    item.onstart = () => {
      if (sessionId !== playbackSessionId || stopRequested) return;
      playing = true; paused = false;
      setPlayBtn('pause');
      highlightWord(i);
      const vName = voice ? displayVoiceName(voice).replace(' ✦','') : '既定';
      setStatus('読み上げ中… ' + vName);
    };

    item.onend = () => {
      if (sessionId !== playbackSessionId || stopRequested) return;
      if (trackingEnabled && wordEls[i]) {
        wordEls[i].classList.remove('active');
        wordEls[i].classList.add('done');
      }
      if (i === words.length - 1) finishPlay(sessionId);
    };

    item.onerror = (e) => {
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      if (sessionId !== playbackSessionId || stopRequested) return;
      playing = false; paused = false;
      setPlayBtn('play');
      setStatus('エラー: ' + e.error);
      showDisplay(false);
    };

    queuedUtterances.push(item);
    speechSynthesis.speak(item);
  }
}

function finishPlay(sessionId) {
  if (sessionId !== playbackSessionId || stopRequested) return;
  clearSentenceTimers();
  queuedUtterances = [];
  playing = false; paused = false;
  setPlayBtn('play');
  setStatus('読み上げ完了 ✓');
  wordEls.forEach(el => {
    el.classList.remove('active');
    if (trackingEnabled) el.classList.add('done');
  });
  if (trackingEnabled) updateBar(totalWords - 1);
  setTimeout(() => {
    if (sessionId !== playbackSessionId || stopRequested) return;
    showDisplay(false);
    resetBar();
  }, 2000);
}

function pausePlay() {
  speechSynthesis.pause();
  clearSentenceTimers();
  paused = true; playing = false;
  setPlayBtn('resume');
  setStatus('一時停止中');
}

function resumePlay() {
  speechSynthesis.resume();
  paused = false; playing = true;
  setPlayBtn('pause');
  setStatus('読み上げ中…');
}

function stopAll() {
  stopRequested = true;
  playbackSessionId++;
  clearSentenceTimers();
  queuedUtterances = [];
  speechSynthesis.cancel();
  playing = false; paused = false;
  setPlayBtn('play');
  setStatus('');
  showDisplay(false);
  resetBar();
  wordEls = []; words = []; sentenceOffsets = []; totalWords = 0; currentWordIdx = -1;
  fullText = '';
}

function highlightWord(idx) {
  if (!trackingEnabled) return;
  if (idx === currentWordIdx) return;
  if (currentWordIdx >= 0 && wordEls[currentWordIdx]) {
    wordEls[currentWordIdx].classList.remove('active');
    wordEls[currentWordIdx].classList.add('done');
  }
  currentWordIdx = idx;
  if (wordEls[idx]) {
    wordEls[idx].classList.remove('done');
    wordEls[idx].classList.add('active');
    wordEls[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  updateBar(idx);
}

/* ============================================================
   UI helpers
   ============================================================ */
function showDisplay(on) {
  document.getElementById('en-textarea').style.display = on ? 'none'  : 'block';
  document.getElementById('en-display').style.display  = on ? 'block' : 'none';
}

function setPlayBtn(state) {
  const btn = document.getElementById('btn-play');
  const icons = {
    pause:  '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
    resume: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    play:   '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  };
  const labels = { pause: '一時停止', resume: '再開', play: '再生' };
  btn.innerHTML = icons[state] + ' ' + labels[state];
  btn.classList.toggle('paused', state === 'resume');
}

function setSpeed(s, el, shouldSave = true) {
  speed = s;
  document.querySelectorAll('.spd').forEach(b => b.classList.remove('active'));
  const btn = el || Array.from(document.querySelectorAll('.spd')).find(b => Number(b.dataset.speed) === s);
  if (btn) btn.classList.add('active');
  if (shouldSave) saveSpeedChoice(s);
  if (playing || paused) {
    const resumeIdx = Math.max(0, currentWordIdx);
    stopRequested = true;
    playbackSessionId++;
    clearSentenceTimers();
    speechSynthesis.cancel();
    playing = false; paused = false;
    setTimeout(() => startPlay(resumeIdx), 120);
  }
}

function restoreSpeedChoice() {
  const saved = getSavedSpeed();
  if (saved) setSpeed(saved, null, false);
}

function updateSentenceModeButton() {
  const btn = document.getElementById('sentence-mode-btn');
  if (!btn) return;
  btn.classList.toggle('active', sentenceMode);
  btn.setAttribute('aria-pressed', sentenceMode ? 'true' : 'false');
}

function toggleSentenceMode() {
  sentenceMode = !sentenceMode;
  saveSentenceMode();
  updateSentenceModeButton();
  const text = textarea.value.trim();
  const display = document.getElementById('en-display');

  if (!text) {
    showDisplay(false);
    resetBar();
    return;
  }

  if (!playing && !paused) {
    if (sentenceMode) {
      buildDisplay(text);
      fullText = text;
      showDisplay(true);
      resetBar();
    } else {
      showDisplay(false);
      resetBar();
    }
    return;
  }

  if (display.style.display === 'block') {
    const currentIdx = Math.max(0, currentWordIdx);
    buildDisplay(text);
    fullText = text;
    currentWordIdx = -1;
    if (currentIdx < wordEls.length) highlightWord(currentIdx);
  }
}

function restoreSentenceMode() {
  sentenceMode = getSavedSentenceMode();
  updateSentenceModeButton();
}

function updateTrackingButton() {
  const btn = document.getElementById('tracking-toggle-btn');
  const bar = document.querySelector('.seq-wrap');
  if (btn) {
    btn.classList.toggle('active', trackingEnabled);
    btn.setAttribute('aria-pressed', trackingEnabled ? 'true' : 'false');
  }
  if (bar) bar.classList.toggle('hidden', !trackingEnabled);
  if (!trackingEnabled) {
    resetBar();
    wordEls.forEach(el => el.classList.remove('active', 'done'));
  }
}

function toggleTracking() {
  trackingEnabled = !trackingEnabled;
  saveTracking();
  updateTrackingButton();
  if (trackingEnabled && textarea.value.trim() && sentenceMode && !playing && !paused) {
    buildDisplay(textarea.value.trim());
    fullText = textarea.value.trim();
    showDisplay(true);
  }
  setStatus(trackingEnabled ? '追跡表示をオンにしました' : '追跡表示をオフにしました');
}

function restoreTracking() {
  trackingEnabled = getSavedTracking();
  updateTrackingButton();
}

function buildChatGPTPrompt(text) {
  return [
    '次の英文をTOEICリスニング練習用に、自然なアメリカ英語で1文ずつ少し間を空けて読み上げてください。',
    '読み上げだけをしてください。',
    '',
    text
  ].join('\n');
}

async function copyChatGPTPrompt() {
  const text = textarea.value.trim();
  if (!text) { setStatus('英文を入力してください'); return; }

  const prompt = buildChatGPTPrompt(text);
  try {
    await navigator.clipboard.writeText(prompt);
    setStatus('ChatGPT用プロンプトをコピーしました');
  } catch {
    const tmp = document.createElement('textarea');
    tmp.value = prompt;
    tmp.setAttribute('readonly', '');
    tmp.style.position = 'fixed';
    tmp.style.left = '-9999px';
    document.body.appendChild(tmp);
    tmp.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(tmp);
    setStatus(ok ? 'ChatGPT用プロンプトをコピーしました' : 'コピーに失敗しました');
  }
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

restoreSpeedChoice();
restoreSentenceMode();
restoreTracking();
</script>
